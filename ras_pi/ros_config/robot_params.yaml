# Robot Controller Parameters
robot_controller:
  ros__parameters:
    linear_speed: 0.15
    angular_speed: 0.3
    safe_distance: 0.4
    goal_tolerance: 0.3

    # Dynamic obstacle detection parameters
    obstacle_threshold: 0.5
    safety_distance: 0.3
    reaction_time: 0.2
    max_linear_velocity: 0.5
    max_angular_velocity: 1.0

    # Automatic exploration
    auto_explore: true
    exploration_goal_timeout: 30.0 # seconds

# Initial Robot Poses
robot1_initial_pose:
  ros__parameters:
    x: 0.0
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0 # 0 degrees (facing +X)

robot2_initial_pose:
  ros__parameters:
    x: 1.0
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 3.14159 # 180 degrees (facing -X)

# Robot Coordinator Parameters  
robot_coordinator:
  ros__parameters:
    coordination_strategy: "frontier_based"
    min_robot_distance: 1.5
    exploration_complete_threshold: 0.90

    # Automatic exploration parameters
    auto_start_exploration: true
    frontier_min_size: 5 # Minimum frontier cluster size
    frontier_cluster_distance: 1.0 # meters
    goal_assignment_interval: 3.0 # seconds
    max_exploration_range: 10.0 # meters from origin

# Multi-Robot SLAM Parameters
multi_robot_slam:
  ros__parameters:
    map_resolution: 0.05
    map_width: 2000
    map_height: 2000
    update_rate: 5.0

    # Dynamic environment parameters
    decay_rate: 0.95
    min_observations: 3
    temporal_window: 30.0
    dynamic_threshold: 0.3

    # Probabilistic mapping
    occupied_threshold: 0.7
    free_threshold: 0.3
    prior_probability: 0.5

# LiDAR Parameters
lidar:
  ros__parameters:
    range_min: 0.15
    range_max: 12.0
    angle_min: 0.0
    angle_max: 6.28318530718 # 2*PI
    angle_increment: 0.0174532925199 # PI/180
